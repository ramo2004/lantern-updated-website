<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <title>Lantern - Walk Safe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --lantern-scrollbar-thumb: #4B7BEC;
      }
      @font-face {
        font-family: 'Centaur';
        src: local('Centaur');
        font-weight: 400;
      }
      html, body, #root { min-height: 100%; }
      html, body { overscroll-behavior-y: none; }
      body {
        margin: 0;
        font-family: 'Centaur', 'Cormorant Garamond', serif;
        background: #0F172A;
        color: #1a1a1a;
      }
      h1 {
        font-family: 'Playfair Display', serif;
      }
      h2, h3, h4 {
        font-family: 'Centaur', 'Cormorant Garamond', serif;
        font-weight: 400;
      }
      .font-centaur {
        font-family: 'Centaur', 'Cormorant Garamond', serif;
        font-weight: 400;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0B1120;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--lantern-scrollbar-thumb);
        border-radius: 5px;
      }
    </style>
    <script>
      // Revert the experiment quickly by changing this to 'pastelOriginal'.
      const ACTIVE_ACCENT_THEME = 'blueAccents';
      window.__lanternAccentTheme = ACTIVE_ACCENT_THEME;

      const accentThemes = {
        pastelOriginal: {
          scrollbarThumb: '#FF6B6B',
          lantern: { DEFAULT: '#FF6B6B', light: '#FF8E8E', dark: '#E05555' },
          teal: { DEFAULT: '#4ECDC4', dark: '#3AB7AF' },
        },
        blueAccents: {
          scrollbarThumb: '#FF6B6B',
          lantern: { DEFAULT: '#4B7BEC', light: '#8CB8FF', dark: '#355FCC' },
          teal: { DEFAULT: '#6CC7F7', dark: '#43B4F2' },
        },
      };

      const activeAccentPalette = accentThemes[ACTIVE_ACCENT_THEME] || accentThemes.pastelOriginal;
      document.documentElement.style.setProperty('--lantern-scrollbar-thumb', activeAccentPalette.scrollbarThumb);

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FFFDF5', // Light Cream
              ink: '#1a1a1a',   // Dark Ink
              lantern: activeAccentPalette.lantern,
              teal: activeAccentPalette.teal,
              mustard: '#FFE66D'
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0"
  }
}
</script>
  </head>
  <body>
    <form name="waitlist" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="text" name="email" />
      <input type="hidden" name="bot-field" />
    </form>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
