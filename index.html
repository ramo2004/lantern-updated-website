    <title>Lantern - Walk Safe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Fredoka:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Centaur';
        src: local('Centaur');
        font-weight: 400;
      }
      body {
        font-family: 'Centaur', 'Cormorant Garamond', serif;
        /* background-color handled by DayNightBackground */
        color: #1a1a1a;
      }
      h1 {
        font-family: 'Playfair Display', serif;
      }
      h2, h3, h4 {
        font-family: 'Centaur', 'Cormorant Garamond', serif;
        font-weight: 400;
      }
      .font-hand {
        font-family: 'Patrick Hand', cursive;
      }
      .font-sans {
        font-family: 'Inter', sans-serif;
      }
      .font-centaur {
        font-family: 'Centaur', 'Cormorant Garamond', serif;
        font-weight: 400;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0B1120;
      }
      ::-webkit-scrollbar-thumb {
        background: #FF6B6B;
        border-radius: 5px;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FFFDF5', // Light Cream
              ink: '#1a1a1a',   // Dark Ink
              lantern: {
                DEFAULT: '#FF6B6B',
                light: '#FF8E8E',
                dark: '#E05555'
              },
              teal: {
                DEFAULT: '#4ECDC4',
                dark: '#3AB7AF'
              },
              mustard: '#FFE66D'
            }
          }
        }
      }
    </script>
